body:
  text: 自敘余自幼遵庭訓誦讀靈素微言講求長沙要旨及博覽名家著述無隱不彰無微不闡燦陳如日月瞭然如指掌夫復何論然猶有不盡詳於著述者暑瘧一門未釋其義故余參考諸書補遺是篇之辨證惟念生人之苦莫甚於病病者必求安於醫醫者者必求效於藥表裡陰陽不容混治差之毫釐失之千里可不慎歟嘗觀夏暑發於秋者或為寒熱或為單熱變狀繁多醫無定案傷生非淺實堪浩歡異惜乎內經起其端而未暢其說長沙統其治而未分其條苟不潛心玩索未易領會是以余不揣固陋乃依靈素為經長沙為緯兼研求先祖家君醫案證論及平凡所治療之經驗者隨證制方爰輯卷帙帙諸君贈名曰秋瘧指南雖屬管見或有小補於世閱者幸垂諒焉中華民國元年歲次壬子仲春月大埔林天佑德臣氏自識秋瘧指南凡例一是書乃闡發秋瘧之專門即俗所謂單燒寒燒是也上卷瘧之寒熱下卷治瘧之單熱一是書辨證原委皆祖於內經辨症虛實多法於傷寒然仲景書治傷寒之專科人所共知統治於諸證世所鮮及茲按六經傳變而治暑瘧之證變隨手取效凡經驗之案原文附錄庶同志者乃便參考一是書之辨證首重表裡陰陽及陽證似陰陰症似陽之疑似處一是書之闡明秋瘧悉辨陰陽相搏金火相爭至於半表裡之柴胡證不能紊治一是書本系平日參考諸書觸類引伸治療經驗之醫案日彌久而稿夥遂成治瘧專科同志索抄依用皆羨效力頗宏慫恿付梓以公諸世僉願派金共成美益余恐重違其意爰輯成卷帙以副諸公樂善之心一暑瘧原無專書治瘧者遂少效驗同志諸公以是書證治系發前人所未逮方便於世利用無窮因題贈書名曰秋瘧指南一是書僅陳某症擬某方猶有二三方而未悉載者因症候變狀多端故刪繁就簡願同志諸君將全卷細為參閱自得其義一暑瘧變症雖可按六經互參至用藥又當權暑濕之標的一是書原未完卷因徇諸君子過為獎藉督梓行故將既編輯之原稿先付剞餘後續就
