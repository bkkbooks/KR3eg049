front:
  text: 秋瘧指南序一人之一身陰陽不得其本或傷天時或失調攝皆足以致病而秋瘧一證千原萬變尤為複雜治難治醫者苟非寢我饋內難會通古今無由藥到病除茲得李偉人君刊送吾邑名醫林德臣先生所著秋瘧指南一冊讀之如飲上池使斯民而免夭扎未嘗不多李君之功今先生即歸道山恨無一面之緣又不禁重致憾於是書也因附紹興裘君重刊以廣其傳焉中華民國八年大捕何約明志於南洋檳嶼山腳醫寓序二嘗讀禮至醫不三世不服其藥竅歡醫理甚微苟非岐軒之術傳自一家靈素之經學專三代則業無秘授而所云得醫之意察脈之真者必無由操其旨也今吾邑中德臣林先自伊祖父以來學有專門先生得所宗而衍家傳之秘者即歷五世於茲矣乃秘授己得其真而又力學沈思以研究靈素之篇金匱之卷是以五氣五色五聲察其微陰淫陽淫風淫知其變吾邑中遠近知名延請調治者應手生春非幸致也蓋由能會意而通變也許允宗曰醫者意也呂子曰病萬變醫亦萬變能知變法如號師夫病之奇而善變莫如濕熱夏暑沾染病發於秋其變狀多端古人傳秋瘧一書未暢其旨先生習是書力叩其局本生平所會心者條分縷析以闡前人未發之意而剖示變態為後人治病之津梁此書一出豈但有功於一鄉一邑哉且有功於一國一世傳萬世而利賴無疆焉陸宣公曰不能為良相當為良醫以救治天下先生其有意於二公之言乎幸毋將此書秘於一家而付諸梨棗以傳四方可也先生聞吾言粲然一笑乃徇所請類次之而梓行於世云時在黃帝紀元四千六百零八年重陽前一日通家弟藍麒祥拜題序三醫學一門群生之性命所繫其業亦最難非素有真積之學不可以為醫非實有康濟之心更不可以為醫晚近以來醫風不振操是業以遊於世者大抵薄涉嘗摭拾方藥即汲汲惟利是圖已耳甚有侈語西醫反薄中醫為無用者其粗浮怪誕更不足道而能疾痛相關慎審明辨不致貽誤生靈者有幾哉惟德臣林先生醫自祖傳兼承庭教恍然有感於庸醫誤人倦倦以濟世為心者久之愈閱歷愈悚惶時加博覽群進而上取內經難經及金匱等篇而力窮其奧凡內因外因與不內外因之故莫不究其然更究其所以然而暑瘧一症則研究尤精取效亦尤多近十年來秋瘧之發他醫茫無所措者一經診治無不應手立效庚戍春爰自取其素所經驗者筆之於書隨病辨證隨症立方先分出數十種輯為二卷餘待後續蓋為便世用非炫長也余與交久知其學且知其心書成索閱益歡條分縷析理法依古變化從心觸類引伸皆發前人所未發准此以治實足為生人造福非學有本原心存胞興其熟能與於欺急勸付梓以公諸世庶贊化調元群生有賴而業斯道者亦或有所愧勵云黃帝紀元四千六百零九年仲秋月弟藍寶瓊謹識
