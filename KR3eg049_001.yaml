body:
  text: 卷一秋瘧原委論説問曰夏傷於暑不適發熱乃至秋而發者何也曰經云暑熱侵於皮膚之內腸胃之外營氣之所舍經隧之界分時值盛夏陽氣從內而外出衛氣仗此猶能剽滑以悍御至秋陽氣斂藏氣自外而入內由是暑氣與衛氣並立邪正相爭寒熱交錯陽勝則熱陰勝則寒病則多頭痛而兼自汗或有飲食積於中濕熱蓄於內暑濕與積熱相搏其勞益張宜香薷蠲暑飲主之用藥須知論説經云善治病者治表不治里然六淫之邪皆傷於膚表腠理之中故凡邪從表來必令仍從表去病方易已是以陷邪入里諸藥當知禁忌知母石羔鎮陷肌腠緻密三焦乃足少陰陽明之羚羊犀角清心肺而涼肝入手太陰足厥陰之藥龜板鱉甲滋腎養肝而入血分乃足三陰之藥沙參骨皮保肺養陰白芍生地平肝涼血以上諸味俱陷邪之類不可不慎蓋暑淫薄於肌腠溜於經舍之間感秋斂之氣乃發或為寒熱或為單熱變狀不一嘗見暑瘧初作輒誤以知膏羚犀龜甲地芍等類致陷暑邪筆試里病勞彌深邪熱輕者則綿延難愈邪熱重者則危殆悉至曷堪名狀茲因世所罕言特表而出之為醫界之方針猶願卓識毋怪吾恣意妄談耳暑濕燥之熱證辨經云逆夏氣則太陽不長心氣內洞秋為痎瘧蓋由過勞致汗液大泄則心陽內虛暑淫乘虛而湊之薄於心脾溜於經隧之舍燠熱內蘊陰液日耗邪熱日熾至而燥金收斂蘊暑受秋燥之斂束其勢必張由是兩相搏激則亢害有燎原之勢故陰欲入而陽拒之則寒火欲出而陰格之則熱金火相爭故寒熱往來口渴心煩頭痛但熱時多兼自汗或譫語脈數大而帶弦或細小伏澀不一自制香薷蠲暑飲主之香薷三分黃芩三錢杏仁錢半赤苓錢半麥冬二錢粉葛一錢生甘六分川連一錢花粉錢半滑石二錢元參錢半如大便祕加大黃錢半水二碗煎至一碗煎至一碗服之此節言陰欲入者燥金之陰也火欲出者暑熱之陽也或問曰經云秋令陽氣斂藏陰氣外此又云陰欲入者何也曰陽氣斂藏者即肌表之陽也然肺主皮毛而溫肌腠所謂陰欲入者皆言肺乃手太陰之陰也其辭似異其義皆同風瘧兼暑瘧之寒熱證辨且夫東南屬異位而近赤道地勢卑而多濕斯民感受暑濕者衆故秋病風瘧亦必多兼暑濕而發越也然風瘧之所由來緣秋令陽氣斂藏陰氣外出而偶受風邪薄於經脈邪欲深入而經脈陰氣欲出是以邪正相搏故寒熱往來遂引郁心脾之暑淫騰騰而發於是頭痛口渴溺赤或舌苔焦黃甚或譫語皆暑濕所由生脈診帶浮滑兼數大凡有頭痛淅淅微惡風熱則多兼自汗自制解肌蠲暑飲主之枳殼八分桔梗八分麥冬三錢香薷三分黃芩二錢半杏仁錢半生甘六分滑石三錢粉葛錢半生扁豆一錢川連一錢元參錢半防風四分水二碗煎一至一碗服蓋言心脾者心主血脈脾主肌肉暑瘧發早晏及間日論説問曰暑瘧發於日早晏者何也曰緣其邪注於伏膂之內循衝脈上行者其氣日高發作日早邪薄於背脊之間循衛氣下行者其氣日下發作日晏又部曰暑瘧有間日而發者猶有發於三日者何也蓋因其邪薄於裡陰橫連於募原經所謂其道遠其氣深其行遲不得與衛氣並行須至間日內著於裡陰之邪方得外出與衛陽之氣交併瘧乃作也但邪薄募原與六腑相連更深一層者所以間二日乃作也然審脈之躁數為陽靜細為陰須圓機而裁之暑邪從太陰濕土化寒證辨問曰鋮有暑薄心脾兼口乾溺赤而發嘗見服參朮溫補而取愈者何也曰此乃偏於純陰之體中州虛濕邪從太陰濕土而化寒故與溫補之劑自能獲效然右關之脈或虛而大或濡而細尤須偵察耳暑瘧有汗無汗證辨問曰暑瘧之證熱時恆多自汗何也曰緣暑濕之淫皆傷膚表腠理不密則汗泄參然有無汗者何也蓋由衛陽盛實則玄府祕密而無汗或偶受風寒表陽被鬱而無汗或肺有留熱鼻孔乾燥而無汗或由陰氣內虛陽氣獨發而無汗或由津液內奪陰虛發熱而無汗或由心火獨盛面色紅紫而無汗司命者更當詳察圓機消息耳暑瘧有先熱後寒先寒後熱證辨問曰暑瘧之寒熱猶有先熱而後寒者何也曰即經所謂夏傷於暑其汗大出腠理開發因遇夏氣悽愴之水寒存於腠理皮膚之中至秋先受傷於風而後受傷於寒故病則先熱而後寒病以時作名曰溫瘧如先受傷於寒而後受傷於風病則先寒而後熱病以時作名曰寒瘧夫風邪傷入無有常處或中於頭項或中於腰背或中於手足然風氣留於肌腠筋骨之間而不移衛氣行至風邪薄之處邪正相應而病作所謂病以時作無早晏者應時而作也乃風邪當留其處之故病則頭痛口渴而無汗脈診帶浮數有力宜解肌蠲暑飲加減主之枳殼八分桔梗八分麥冬二錢香薷三分黃芩三錢杏仁錢半生甘六分滑石三錢粉葛錢半川連一錢羌活五分淡竹葉錢半水二碗煎至一碗中部服瘧病初作但寒未熱證辨問曰暴受風寒遂成寒瘧發則但寒而未熱者何故曰苟因寒邪客於肌腠即欲內薄而經脈之陰氣外出邪與陰氣相搏發則但寒而未熱留連一二日肌腠之邪必鬱而成熱與經脈之陰氣相激遂發寒熱往來之證矣暑瘧喜飲熱茶證辨問曰寒熱往來口渴唇白而喜飲燒茶愈滾愈快傾壺可納者何曰此乃陽明偏旺或肺有積熱中氣盛滿喜飲燒者同氣相求也唇白者血由邪遏不達於四白也即口唇也甚或脈且小弱或微而數同志者須當慎察幸勿以中土虛寒為例鹵莽誤事也宜香薷蠲暑飲倍用麥冬花粉主之蓋瘧之寒熱往來寒時喜飲燒病之常情此所謂喜飲燒言其愈壯熱愈喜燒也瘧之寒熱服辛散溫證辨問曰暑瘧之寒熱往來有服桂枝湯而即愈者有服羌防辛散而即愈者有服參林溫補而即愈者何也曰此非暑瘧也苟因暴受岡寒薄於經脈邪欲內搏值經脈之陰氣外出邪正相爭而作故服辛散等劑皆能取效邪尚在肌表未曾深入故也嘗見有誤服辛溫之劑遂成潮熱譫語甚則捻衣撮空皆兼暑蠍所致也願同志者慎之幸甚小柴胡湯辨論問曰暑瘧忌用小柴胡者何也答云昔賢設立小柴胡乃少陽經之和解法也傷寒篇云邪在上者吐而越之邪在表者汗而解之邪在裡者下而奪之惟少陽經有汗吐下之三禁焉蓋少陽乃半表半裡之樞半陰半陽之界若誤於汗變生譫語若誤於吐變生驚悸若誤於下變生漏利故立小柴胡而和解耳且少陽之脈必帶弦其見證皆脅痛耳聾口苦目眩而帶嘔寒熱往來如瘧狀嘗見世醫治暑瘧者妄擬小柴胡為的劑胎害之甚曷堪名狀何也人但知少陽居臟腑之交表裡相爭則寒熱生焉殊不知暑瘧注經隧之舍陰陽相搏亦寒熱生焉其症雖相類其因實各異苟不明辨妄擬於彼紊治於此輕則留連難已重則危殆悉至鮮有不傷生之誤所謂藥能救人亦能殺人如水能浮舟者亦能覆舟正此義也惟願肩斯道者消退深究細繹庶我同人共登仁壽矣冒受暑風濕流經絡酒濕肺郁證辨寒熱往來數日不已忽然四肢瘛瘲口眼否斜此乃冒受風邪所致所謂暑風者此也擬香薷蠲暑飲加粉葛三錢羚羊一錢防風一錢水煎與之數劑全愈寒熱往來兼骨節刺痛四肢著痹或䐜腫身重難於轉側此乃暑濕流於經絡注於骨節之間所致擬香薷蠲暑飲加木瓜分防己錢半生二錢靈仙八分水煎服而愈寒熱往來兼頭面浮腫而黃滯或兩眼朦視或胃脘作痛審其平素嗜酒是酒濕傷蒸所致擬香薷蠲暑飲加葛根三錢葛花二錢枳椇子三錢水煎與之數劑而愈寒熱往來咳逆而兼心脅滿痛引少腹甚則難於轉側此乃肺金不利清肅不行三焦不通少陽不升擬香薷蠲暑飲加桑椹二錢覆花一錢紫苑一錢柴胡八分大黃錢半水煎與服數劑而愈桑椹即桑子暑瘧欲解戰汗狂言證辨問曰瘧研究室初作了蠲暑飲三劑病可遂愈嘗有服藥後瘧勢益作者何也蓋因其邪深入心脾或兼積熱內蓄服湯後必交戰汗而解礦瘧熱益作甚或狂言妄語宜加大黃二錢將方再進數服自能獲效然此證情狀是為吉不兆譬以天雨將降則六合陰晦鬱氣炎蒸必待雨後天霽晴和萬物方蘇問曰瘧之所作嘗見服湯後間有奄然發狂濈然汗出者何也曰即傷寒篇雲陽勝陰虛者將振汗而解必奄然而狂邪隨汗解其病遂愈暑邪深淺證辨問曰藥餌中病隨手取愈理固然也間有調冶經旬越月而愈者何也曰惟當審辨邪熱深淺質體強弱然暑熱薄於皮膚之內經隧之舍則治療易痊更有誤投陷邪藥餌或邪薄於三陰三陽或邪薄於五臟或兼五郁見證此皆其邪固蓄病熱彌深誠難速效治當和緩茲將內經辨論五郁發病入三陰三陽五臟病證原委附録以便參考至於邪熱深淺質體強弱願同志者圓機化裁尤須合參五運六氣有太過不及之風歲有正化對化之年及夭符歲會之變宜詳慎焉五常政大論曰必先歲氣無伐夭和無盛盛無虛虛無致邪無失正斯為良工五郁病證六元正紀大論曰金鬱之發民病亥逆咳逆心脅滿引少腹善暴痛不可反側嗌乾面塵色惡山澤焦枯水鬱之發民病寒客心痛腰椎痛大關節不利屈伸不便善逆痞堅腹滿陽光不治木鬱之發民病胃脘當心而痛上支兩脅膈咽不通食飲不甚則耳鳴眩轉目不識人善暴僵仆火鬱之發民病少氣瘡瘍癰腫脅腹胸背面目四肢䐜憤脹瘍痱嘔逆瘛瘲骨痛節乃有動注下溫瘧腹中暴痛血溢流注精液乃少目赤心熱甚則瞀懊善暴死土鬱之發民病心腹脹腸鳴而為數後甚則凡痛脅䐜嘔吐霍亂飲食注下浮腫身重此五郁之病嘗見隨六氣而發司命者宜參考焉三陰三陽經氣瘧證辨經云寒熱往來令人腰痛頭重寒從背起炕熇熇暍暍然熱已汗大出此乃足太陽膀胱經氣之為病也夫太陽之脈起於目內此眥從頭下後項連風府行身之背所以腰痛頭重寒從背起皆太陽之經氣致病也宜羌活蠲暑飲主之羌活四分青蒿五分杏仁錢半花粉二錢麥冬二錢生甘五分川連一錢條芩三錢滑石二錢淡竹葉一錢白微一錢生薑一片大棗一隻水二碗煎至一碗服之經云寒熱往來令人肢體懈惰惡見人見人則心惕惕然熱甚而汗大出此乃足少陽膽之經氣為病也所以肢體懈惰而惡見人者皆少陽甲木失生升之條達抑而不暢之故宜柴胡暑飲主之柴胡八分杏仁錢半赤苓錢半生甘五分青蒿五分條芩二錢麥冬二錢川連一錢桂枝錢半滑石二錢澤瀉錢半連翹一錢薑棗引水二碗煎至一碗服經云寒熱往來令人寒則灑灑淅淅寒甚乃熱熱則汗出喜見日月燭光之氣乃快然此即陽明胃之經氣為病也蓋陽明本是陽熱之氣喜見光者從其類也宜葛根蠲暑飲主之葛根二錢杏仁錢半麥冬二錢滑石二錢條芩三錢赤苓錢半生甘五分川連一錢淡竹葉一錢青蒿五分花粉錢半白微錢半大黃錢半薑棗引水二碗煎至一碗服經云寒熱往來令人不樂好大息而不嗜食寒熱甚而汗出至則善嘔吐此乃足太陰脾之經氣為病也所以病至不嗜食而善嘔吐皆太陽之濕土所致然意藏於脾故脾病則令其意不樂也宜白蠲暑飲主之白朮二錢川連一錢赤苓二錢生扁豆錢半條芩二錢麥冬二錢滑石一錢杏仁一錢生甘五分青蒿五分川朴一錢半夏一錢陳皮一錢薑棗引水二碗煎至一碗服經云寒熱往來令人多熱少寒且兼吐欲閉戶牖而處此乃足少陰腎之經氣為病也蓋腎司寒水而主閉藏故其病則欲閉戶延遲而處者陰主靜也凡病綿延難已宜茯苓蠲暑飲主之茯苓二錢川連一錢生甘五分青蒿五分條芩二錢麥冬錢半叉斛錢半竹茹一團滑石一錢澤瀉錢半半夏錢半大黃二錢陳皮一錢薑棗引水碗半煎至八分經云寒熱往來令人腰痛少腹滿小便不利如癃狀其氣不足意多恐懼腹中悒悒不舒此是足厥陰肝之經氣為病也然厥陰之肝脈環陰器抵少腹而主疏泄肝不條達則疏泄不行故溲溺不利如癃狀腰痛少腹痛悒悒者皆肝氣不舒之所致宜柴胡桂枝蠲暑飲主之柴胡一錢桂枝錢半條芩二錢麥冬錢半川連錢半杏仁錢半赤苓錢半滑石一錢生甘五分青蒿五分黃柏八分丹皮一錢薑棗引水二碗煎至一碗服五臟瘧證辨經云肺瘧者令人心寒寒甚乃熱熱則善驚如有所見然肺為心之蓋肺邪于于心則令心寒熱心氣虛則善驚如有所見矣經云心瘧者令人心煩甚欲得清水反寒多不甚熱蓋心乃陽中之太陽心氣熱故令心煩之甚欲得清水而自救然熱極則生寒所以反寒多而熱不甚也經云腎瘧者令人灑灑寒腰脊痛宛轉大便難目眴眴狀手足寒夫腎與膀胱禁止為表裡故邪干於表則令人灑灑惡寒腰脊雖痛而能宛轉邪熱灼液則大便難熱極則目眴眴然而不明經云胃瘧者令人目病也善肌而不能食食而支滿腹大蓋胃司受納故胃瘧者令人病肌而不能食中焦受邪不能運化故食則支滿而腹大然陽明之脈起於鼻絡於目所以胃病令人目皆痛也經云脾瘧者令人寒腹中痛熱則腸中鳴鳴已汗出但脾乃陰中之至陰腹乃脾土之城郭故濕熱內攻則腹痛下行則腸鳴上蒸則汗出也經云肝瘧者令人我蒼蒼然善大息其狀若死者蒼乃東方之青色主春生這氣生陽不升則抑抑不舒故善不息其狀若死也暑瘧症十餘天寒熱已解時復煩熱頭痛或時胸前脅肋痛或時心栗而不安大便難此陽明餘熱未解宜用芩連麥冬生軍菊花之類審病體強弱裁之暑瘧證十餘天寒熱已解舌胎微黃稠涎滿口腹脹硬拒按大便難此陽明熱甚宿食壅滯宜用芩連枳實酒軍麥冬川朴甘草之類審病機裁度暑瘧之脈有弱澀伏不一皆由熱邪壅遏氣血不宣所致猶有兩寸關有力獨兩尺微弱無力者慎勿輕投藥餌誤汗則亡陽誤下則傷陰須先補益用潞黨淮山茯神甘杞炙甘巴戟叉斛麥冬之類或建中湯甘杞甜蓉熱勞盛者少加芩連而御之候兩尺有力乃施去邪劑方為穩當寒熱往來服蠲暑飲不解遂致蒸蒸發熱或日晡潮熱或微煩溺數腹滿便結俱皆陽明胃實所至宜調胃承氣湯加味主之大黃三錢玄明粉二錢羚羊一錢條芩四錢麥冬二錢生甘六分水二碗煎至一碗空心服寒熱往來口渴頭痛誤以辛溫劫散之劑遂蒸蒸發熱或譫語昏狂或日晡潮熱溱溱自汗皆誤於劫汗傷津益助邪熱所致宜調胃承氣湯加減主之條芩三錢大黃三錢麥冬二錢川連錢半生甘六分元參錢半知母錢半生梔錢半元明粉一錢水二碗煎至一碗服寒熱往來寒輕熱甚口乾頭痛身疼脈數滑或浮大無汗者此乃兼受風寒邪氣覆郁衛氣盛實之故宜香薷蠲暑飲可比例而參用之每見妄施以羚羊犀角石羔之類逆折其熱則表陽愈鬱而鬱熱轉劇醫以珍珠貝母之輩重復清之遂引外邪內陷則熱勞彌深危殆悉至由是邪熱內擾煩躁狂譫五心發熱舌苔黃燥齒焦眼熱甚或身重難轉昏昧沈迷三焦不通二便燥祕種危候粗工之誤嘗觀高車駟馬之名工比比皆是余每遇患此症於垂危之際遂擬雨澤湯與服二三劑後若得濈濈自汗者則諸恙易已同志者宜當參考東洋參一錢黃芩二錢香薷三分防風一錢麥冬三錢川連一錢花粉一錢生甘五分滑石三錢柴胡八分粉葛錢半生梔錢半青蒿五分杏仁錢半大黃錢半水二碗煎至一碗中部服寒熱往來口渴自汗脈數而小醫以鳥梅鱉甲之類而截其瘧遂引外出之邪復陷於經脈以致似寒不寒似熱不熱昏沉似醉神明不定表陽被郁四肢瘛瘲種種惡候皆誤於斂補之過耳若因循不治焉得不夭折而斃也遂以香薷蠲暑飲與二三劑得汗而解繼用清肺飲洋參沙參麥冬石蓮茯神生芍玉竹叉斛與之療痊暑瘧證有日夜惡寒身熱熱不甚劇引衣自覆頭額痛口燥渴脈數大舌胎黃大便難此陽明有積熱宜蠲暑飲加生軍菊花蒼耳子防風主之暑瘧證寒熱往來遍身痛楚口燥頭痛脈數或伏澀此是濕熱壅滯經絡不通榮衛不宣宜香薷蠲暑飲加生軍二錢防風一錢青蒿八分連服數劑後遍身汗越其病自痊暑瘧初作有妄施溫劑雜藥以致三焦閉寒榮衛不通四肢逆冷人事昏迷心中躁悶口燥舌焦六脈伏澀或數澀宜香薷蠲暑飲加生軍青蒿防風之類與之必使寒熱振作溱溱汗越病機乃轉耳暑瘧初作妄投鱉甲羚羊養陰等類與之瘧病遂已其人煩躁臥寐不寧或口燥頭痛或咫煩冤或腰腹疼痛或二便祕澀此乃邪陷入陰宜速投香薷蠲暑飲仍使寒熱腹作溱汗越邪從表解而後可若大便祕甚當加生軍元明粉暑瘧證或寒熱或單熱其連日服藥連日汗越令邪從汗解病勢自然日退嘗有明此義而慮亡陽妄施藥餌而斂汗致遺其害可勝言哉問曰寒熱往來腹痛而逆氣衝胸渾淪如卵者何蓋由暑暍挾痰飲隨肝火而上越也然木旺則剋土故為腹痛肝之性最善逆於上遂引痰飲沖胸渾淪有物狀覺如雞卵大忽升降其痛若刺此乃有形之痰隨無形之火而升降耳自制柴芩和解飲主之柴胡八分生梔錢半黃芩三錢杏仁錢半茯苓二錢半川連一錢麥冬二錢陳皮六分半夏八分生甘五分青蒿五分枳殼六分水碗半煎到八分服寒熱往來頭痛微汗口乾燥咳氣逆不得臥寐皆由暑暍挾陽明燥熱而爍肺肺熱甚則引風而煽火治之之法宜八分滋燥二分疏散則得矣若以風寒同例妄投辛散之風藥恐必致金破音傷然風藥屬辛辛耗肺氣風藥屬燥燥劫陰液且肺乃諸臟之華蓋主治節而濡津液其喜潤而惡燥今既傷於暑燥若更誤於風燥禍有反掌而得乎自制滋燥飲主之若大便燥祕加大黃花粉二錢半赤茯錢半生甘八分黃芩三錢枳殼八分杏仁錢半覆花一錢麥冬三錢紫苑錢半川連一錢桔梗八分元參二錢半防風五分蜜杷葉錢半水碗半煎至八分服寒熱往來而腹痛下痢裡急後重者皆由腸胃疊積濁滯不行與濕熱蒸釀搏結於衝任之分野逼迫成痢由是濕傷氣則多白熱傷血則多赤如氣血俱傷則必致赤白兼半工治者行陽明之壅滯而後重自己宣氣血之鬱熱而赤白自除自制滌垢飲主之如小便不利加滑石黃芩三錢赤芍錢半粉葛錢半枳殼八分生甘六分蓁皮五分川連八分花粉錢半粉丹一錢桔梗八分油歸八分杏仁錢半酒大黃錢半紅多加白頭翁二錢白多加橘紅五分水二碗煎至一碗服寒熱往來口苦目眩而脈帶弦數者乃兼少陽半表半裡之證小柴胡湯主之若口渴自汗溺澀者除半夏加天花粉赤茯澤瀉麥冬治之柴胡八分沙參二錢半夏八分赤茯錢半條芩二錢天花粉錢半麥冬二錢澤瀉錢半生甘六分水碗半煎至八分服之寒熱往來頭痛口渴表散之劑過劫其汗遂致煩熱尤熾口愈渴溺愈澀此為劫汗傷津所致若脈虛者宜沙參洋參麥冬五味之類以保脈生津幸勿以利水攻散之劑重竭津液變生危候試舉一隅以為例則三隅知所反焉願同志者慎之慎之寒熱往來醫以駿表其汗遂致煩熱益甚自汗不已口渴溺澀寐不寧脈尤數而有力宜速救幾滅之真陰庶幾免夭折之冤也宜以生地黃湯加味主之生地三錢沙參三錢粉丹八分茯神一錢羚羊一錢麥冬二錢淮藥一錢生芍錢半叉斛錢半貢阿膠錢半洋參一錢五味十粒水碗半煎至八分服寒熱往來口乾脈數醫以羌防之劑過發其汗以致神昏語亂但熱不寒溲溺短赤皆同誤汗傷津津竭則燥熱愈熾勞勢所必然宜當保津液而清燥熱致令陰陽和而津液自通擬用清燥生津飲主之東洋參二錢羚羊一錢生甘五分條芩三錢花粉三錢麥冬二錢蓮子心一錢川連一錢香薷二分生梔錢半元參錢半水碗半煎至八分服寒熱往來脈數滑誤以汗下後脈更數而有力心益煩肢體益躁皆由服藥不當劫血傷津所致斯際猶恐危殆悉至圓機之士宜詳審施治而起沈痾若口渴舌燥者擬用生地黃湯加味以救陰液服二三劑後脈見調勻惟熱勢猶熾者除地芍沙參加芩連而導暑濕生地二錢淮藥錢半沙參二錢洋參一錢蓮心一錢生芍一錢茯神錢半麥冬錢半丹皮一錢叉斛錢半水碗半煎至八分服此證服六味湯二三劑後脈猶數而鼓指或口渴引飲當用四物湯加甘杞巴戟等類或加參附隨病機裁度寒熱往來口乾頭痛醫以防風風荊芥羌獨活之劑過劫其汗以致四肢微急溲溺不利至因循失治遂成痙證或四肢徑急或背反張此由劫汗太過津液內竭筋失濡養故成痙急之證擬用歸芍八味加減主之當歸二錢熟地三錢茯神錢半粉丹八分麥冬二錢蓯蓉錢半生芍錢半蘇淮錢半澤瀉一錢萸肉四分甘杞錢半洋參一錢叉斛錢半川芎一錢川連八分水碗半煎至八分服暑瘧證或寒熱或單熱服湯後瘧病遂除或煩而不寐或時有微熱或肢節煩痛若小便不利者是膀胱濕熱未解宜豬芩湯主之豬芩澤瀉赤茯滑石貢膠麥冬叉斛寒熱往來誤以劫散太過以致自汗身熱頭眩心悸肌肉瞤動其身戰聳四顧倣徨無可置身之狀即太陽篇所謂振振欲劈地欲闢虛而就實也即此誤汗亡陽之變故擬真武湯加味以救逆肩斯者不可不慎白朮二錢炒芍錢半甘杞錢半茯苓錢半焙附錢半潞黨三錢大棗一隻歸身錢半五味十粒水碗半煎至八分服加麗參更妙此證猶有熱壅經絡以致肌肉瞤動因劫散太過其瞤動之勢益甚臨證者審之寒熱往來醫乃輒投知羔犀角大黃之類遂引暑濕之邪陷入膀胱以至小腹硬滿溲溺短澀兩腿無力胸中氣逆時兼眛冒此皆初時孟浪施治之咎蓋太陽之氣生於下焦貫膈布胸中以達膚表苟誤陷邪藥餌更兼峻下太過遂成陰氣彌胸以致宗氣不利清陽不升濁陰不降暑濕不解茲擬清暑益氣湯加減與數服遂痊野生參一錢歸身一錢茯苓一錢陳皮六分車前一錢白朮錢半茯苓二錢澤瀉錢半朱曲一錢潞黨三錢炙甘八分麥冬一錢滑石一錢蜜升麻三分水碗半煎至八分服此證若小腹不滿而溲溺自利者當除滑石茯苓車前澤瀉等類加升陽補益之劑如若小腹滿痛溲溺自利大便黑色或漱水不欲咽是血瘀膀胱宜佻仁承氣湯主治暑瘧證寒熱往來醫以輒投石羔大黃知母犀角等類遂引瘧邪內陷於裡以致似寒不寒似熱不熱遍身疼痛腹中氣逆上衝於胸劇則時兼冒昧此皆外邪人裡裡不受邪宜薷香蠲暑飲主之必令寒熱復振邪從汗解方可寒熱往來口渴頭痛誤用劫奪之劑用致煩熱日甚躁無寧時或四肢微冷膠脈微細者乃亡陽之機宜投四逆湯加味主之此與太陽篇劫汗亡陽之證互參黑薑一錢甘杞錢半茯苓錢半焙附一錢炙甘六分潞黨三錢歸身錢半水一碗煎至五分服寒熱往來因以峻下傷脾以至腹滿急痛脈診弦小建中湯加味服之急痛遂愈然腹滿寒熱如故擬四君子加芩連審熱勢裁之桂枝五分生芍三錢甘杞錢半黑薑五分炙甘八分白朮錢半大棗五粒水一碗煎至八分另入飴糖五錢令煬盡服寒熱往來頭痛口渴小腹滿痛溲溺短澀此由濕熱流入膀胱氣不運化之故宜五苓散加減主之豬芩錢半條芩二錢蓮心一錢麥冬錢半澤瀉錢半茯苓二錢滑石三錢花粉錢半水碗半煎至八分服寒熱往來診脈浮而虛醫以苦寒之劑直折其熱脈反浮大而鼓指更以大黃枳實之類重復下之遂致脾元受傷腹脹而鼓神明若失虛氣上逆裡急後重危症蜂起皆緣不辨症之虛實妄投藥餌之誤也遂擬歸芍六君加味主之當歸錢半潞黨三錢茯苓錢半首烏二錢棗仁八分白芍錢半白朮錢半炙甘五分甘杞二錢龍眼十隻焙附一錢水二碗煎至一碗服寒熱往來脈浮細而無力者有用以涼散之劑內攻其裡外攻其表以致表裡俱傷四肢微厥神明若失時兼漏汗皆由不審脈證之虛實妄施攻伐之過耳遂用耆附六君湯加味主之野參一錢茯神一錢白朮錢半甘杞錢半棗仁一錢焙附一錢五味十粒炙甘六分酒耆八分首烏錢半歸身一錢水碗半煎至八分服寒熱往來脈浮小或遲細醫以大黃枳實之劑峻下之寒熱如故反渴而喜飲溲溺短澀與以穀食則嘔此本由中土虛寒復誤於攻下中州失健運之常胃陽失司納之權故與以食則嘔津液致傷內生虛燥故口渴而溺澀嘗見假實假熱之誤治即經所謂虛其虛之義也若不明辨脈證之虛實重復誤於攻下禍有不旋踵乎遂用四君子湯加味主之洋參一錢白朮錢半生芍一錢茯神錢半炙甘六分扁豆錢半潞黨錢半蘇淮錢半車前一錢建蓮一錢大棗一粒陳倉米一勺歸身一錢龍眼五粒服一二劑後穀食漸進口渴漸除寒熱如故者加香薷杏仁此證猶有誤下後以致泄利口渴者當用耆附六君加熟地酒芍五味等類亟先救其裡寒俟利以意消息之寒熱往來口乾頭痛審右關脈虛弱者此皆由中氣虛乏宜白朮蠲暑飲加減主之潞黨二錢白朮錢半茯苓錢半生扁豆錢半條芩錢半川連錢半麥冬錢半香薷三分羌活四分生甘五分水燉半飢服寒熱往來口乾不渴咳嗽而遺小便脈虛弱者乃脾腎兩虛膀胱失職宜小建中湯加味主之俟小便不遺隨證化裁安桂心六分生芍三錢炙甘六分白朮錢半甘杞錢半大棗五粒飴糖六錢甜蓉二錢潞黨二錢水燉半飢服凡用飴糖將藥燉出味去渣後入飴糖令煬盡溫服若寒熱往來口乾燥渴嗽嗽遺溲是濕熱為患不可不辨暑瘧寒熱苟因峻下以致腹滿泄利薑附六君加車前粟殼五味主之若腹脹而溲溺不利遍體晦黃皆由峻下傷其脾元劫奪津液所致藥餌不當暑濕不解瘀郁肌表遍體晦黃寒熱如故診脈或遲弱或虛大不等宜四君子加味主之熱勢輕者加薑附野參圓機裁之潞黨三錢茯神錢半妙扁豆錢半洋參八分川連一錢於朮錢半炙甘三分炒苡米錢半建蓮二錢木瓜六分當歸一錢諸證者美術界經誤於汗下劫奪以致虛證蜂起雖寒熱如故亦亟當固本為要庶免虛其虛之患同志者合細繹之治暑瘧雖可興傷寒互參然用藥當權暑濕之標準臂之作文不合於古不佳不離於於古又不佳宜圓機消息寒熱往來以汗下傷津以致溲溺不利更誤以苦寒之劑滲利其小便遂成微熱脹滿氣逆劇則䐜脹昏迷而裡急皆由津液內竭脾腎兩傷當速扶元氣而起垂危之疴自制保元湯與之服後病勢稍定更加參附服之遂愈潞黨三錢於朮錢半炒芍錢半淮膝一錢炙甘五分炒洋參一錢甘杞錢半首紅錢半巴戟二錢五味十隻茯神一錢當歸二錢棗仁一錢龍眼肉一錢水一碗煎至八分服之寒熱往來舌乾口渴虛氣上逆濈濈自汗腹濡數醫誤汗下之劑以致脈反數無偷身熱昏迷劇則狂妄而欲走此由陰精素奪既誤汗傷津更復誤下傷血若小便尿血者更劇自制補陰益氣湯主之生野參一錢潞黨二錢沙參三錢蓯蓉二錢丹皮一錢生芍錢半當歸二錢車前一錢甘杞三錢叉斛錢半五味十粒麥冬錢半川芎一錢生地二錢牛膝一錢蘇淮錢半水碗半煎至八分服寒熱往來虛而數醫不審治誤於汗下傷陰遂致小便尿血淋漓刺痛宜生地六味湯加味主之生地四錢茯芩錢半粉丹錢半麥冬二錢蘇淮錢半叉斛錢半生芍錢半車前一錢澤瀉錢半水碗半煎八分空心服寒熱往來口渴而脈濡數旬日病已遂致氣臭穢兩頰黑腫而硬痛或生於左或生於右亦不等皆由苦寒太過胃陽被遏火毒凝聚所致是為危候宜自制升陽益胃湯主之可全萬一之幸生耆四分芎川八分潞黨二錢白朮一錢白芷八分茯苓錢半當歸一錢麥冬錢半生甘六分野山參一錢粉葛一錢沙參三錢羌活四分赤芍一芍叉斛錢半水燉和童便徐徐咽之外敷法川芎一錢生川烏八分人言少許白芷一錢蘇珠三分梅片三分共研細末此散均三次用馬鞭草槌爛合敷患處此人言即砒霜凡用者宜小心收貯庶免胎誤寒熱往來半月後乍愈乍作越月不已忽然大寒大熱兼下痢赤白氣急神困陰陽欲脫之勢診脈虛小而數余忖危則急宜固本為要遂用生麗參一錢磨人乳均二三次服及擬六君子湯加味主之潞黨錢半茯神錢半歸身八分甘杞錢半麥冬錢半於朮八分生甘五分生芍錢半首烏錢半五味八粒沙參二錢水燉服此湯服後次日瘧症頓除氣息頗順惟下痢益甚滯澀之極繼用益中湯加酒芩酒軍麥冬等類與之數劑後諸羞悉退按此證初時藥餌不當致陷暑熱留連於脾胃之故益中湯加味列下此方服後下痢稍輕即除酒軍加酒連或加潞黨洋參審病勢化裁久病之人腸胃必虛當顧慮元氣為王道沙參二錢建蓮錢半酒芩一錢酒大黃一錢油歸六分蘇淮錢半炙甘三分生甘三分麥冬一錢生芍錢半水燉中部服寒熱往來與以涼散之劑服之寒熱悉退惟頭痛不已面色紅而嬌嫩脈帶數而無力此乃陽虛所致茲擬以獨參湯服之遂安生野參錢半龍眼肉麥冬茯神為引寒熱往來服涼散之劑諸證悉除惟頭痛不已溺時尤甚此乃陽虛所致宜獨參湯主之寒熱往來服湯後遂已惟飲水不下咽即吐溺時則昏冒不省欲死之狀片時乃復醒此是中氣虛寒清陽不升之故宜獨參湯主之或加焙附暑瘧之寒熱旬日而愈惟頭痛不已諸藥罔效延余診視右手脈俱浮濡皆陽虛所致遂擬參附湯加熟地與服而愈高麗參一錢焙附錢半老熟地一錢水燉空心服附滑石石膏辨論滑石其質輕清性味甘淡而寒泄心肺之熱邪上開腠理下達膀胱行水道通九核療嘔吐解煩渴乃治暑瘧之聖藥也然暑為陽邪嘗見病作皆寒輕而熟甚熇熇暍暍之勢而莫制故擬蠲暑飲取用芩連滑石麥冬等類而清內蘊之燠熱也石羔氣味辛而寒無毒主驚喘寒熱口乾舌焦腹中堅痛陽明熱盛故仲景治太陽風寒兩傷之病必審其煩躁無汗而喘渴者擬大青龍湯用石膏而清內熱之法也治陽明發熱微惡寒這病必審其口乾舌焦大渴而自汗擬用知母石膏而清胃火之法也訒庵謂石膏能發表殊屬不合經旨今特訂之嘗觀世醫治暑瘧妄擬石膏之貽害卷面既詳言矣茲不復贅石膏大黃區別論説余於已酉仲夏寓茶陽之精舍有客鄒生問曰石羔大黃皆陽明之涼藥嘗見區別之用有如風馬牛不相及者何也余曰子之顧問誠醫界之方針醫能洞察表裡陰陽之辨則用藥自知間不容髮嘗考昔賢辨證立方理精法密療表惟恐陷邪里猶恐傷陰加一味則不同方減一味則不同治井井有條不容苟混然石羔性寒清胃火而療肌熱色白以入肺質重而鎮墜蓋暑瘧初作忌其鎮墜而陷邪故當禁用焉大黃性寒而味苦能蕩滌里陰之壅熱但暑瘧初作嘗有熇熇暍暍之勢欲救一線之陰則大黃鬚急用焉所謂區別之用者此也客唯唯退謝附録陶節庵傷寒摘要節庵云傷寒汗下不愈而過經其證尚在而不除者亦溫病也經曰溫病之脈行在諸經不知何經之動隨其經之所在而取之但暑瘧傳變亦或有之證故略引舉於下以便參考如太陽證頭痛惡寒寒汗下後過經不愈診得尺寸俱浮者太陽溫病也如身熱目疼汗下後過經不愈診得尺寸俱長者陽明病溫也如胸脅痛汗下後過經不愈診得尺寸俱弦者少陽病溫也如腹滿咽乾診得尺寸俱沈細過經不愈太陰病溫也如煩滿囊縮診是尺寸俱微緩過經不愈者厥陰病溫也發汗後晝煩夜靜不嘔渴無表症脈微沈乾薑附子湯陽微發汗躁不眼與大下後復發汗晝日不得眠至夜安靜身無熱乾薑附子湯汗下後病不解而煩躁者茯苓四逆湯俱謂陽虛煩躁也又有不煩便作躁悶者此為陰盛拒陽也欲於泥水井中臥飲水不得入口者是也四逆湯主之發汗後其入臍下悸欲作奔豚茯苓桂枝白林甘草湯太陽病發汗不解欲發熱心下悸頭弦肌體瞤動振振欲劈地真武湯身熱頭痛脈反沈若不瘥身體疼痛當救其里四逆湯主之煩熱者不經汗吐下則為煩熱與發熱有異也經曰病人煩熱汗出則解如未作膈實但當和解微熱而已若心下滿而煩則有吐下之殊也先煩而悸者為實先悸而煩者為虛虛謂心中欲嘔欲吐之貌陽明病心煩喜嘔壯熱往來心下悸小便不利小柴胡加茯苓湯煩熱為擾亂而煩躁乃憤怒而躁謂先煩漸至躁也有陰陽虛實之別心熱則煩陽實陰虛腎熱則躁陰實陽虛煩為熱輕躁者熱重所謂煩躁者先發煩而漸至躁所謂躁煩者先發躁而後發煩也太陽中風不得汗煩躁者此邪在表而為煩躁也羌活沖活湯大便不通六七日繞臍痛煩熱發作有時而渴者此為躁屎乃邪氣在裡而煩躁也大承氣湯太陽不得汗醫以火劫取汗火熱入太陽中風自汗脈浮緩用桂枝湯汗出而渴小便難五苓散不渴者茯苓甘草湯自汗出小便難而用桂枝惟加甘草白芍自汗出小便不數心煩微惡寒腳攣急宜桂枝附子湯自汗出小便數心煩微惡寒腳攣急宜乾薑甘草湯陽明汗多而渴發熱譫語大便硬調胃承氣湯太陽病發汗遂漏不止惡風寒用桂枝附子湯若小便自利而汗出為津液少不可攻利宜蜜導煎能之若汗多者胃汗乾急下之用大承氣湯汗多而渴勿用五苓散汗不止無他證者搵粉撲之服桂枝湯大汗出煩渴不解脈微洪大者白虎加人參下後不可更用桂枝湯若汗而喘無大熱者麻黃杏仁甘草石膏湯陽明汗多夜不便不利若小便反利者屎雖硬不可攻下宜蜜煎導法若誤攻之則津液竭絶傷寒寸脈遲者不可汗尺脈遲者不可下宜先服小建中湯三黃石羔湯有傷寒發熱脈大如滑數表裡皆實陽盛拂鬱醫者不達既發其汗病勢不退又復下之大便遂頻小便不利五心煩熱兩目如火鼻乾面赤舌燥齒黃大渴過經既成壞證亦有錯治諸溫而成此症者又八九日既經汗下脈洪數身體壯熱拘急沈重欲治其內由表未解則里證又急超趄不能措手待斃而已殊不知熱在三焦閉澀經絡津液枯涸榮衛不通遂成此症耳石羔兩半黃芩七錢黃連七錢黃柏七錢淡豉二合麻黃一錢梔子三十個上每服一兩水二鍾煎服未中病再服其效如神傷寒即經汗吐下誤治後三焦生熱脈復洪數譫語不休晝夜喘息鼻加衄血病熱不解身目俱黃狂叫欲走三黃石羔湯主之陽毒傷寒皮膚斑爛身如凝血兩目如火十指皮俱脫煩渴躁急不寧庸醫不識莫能措手命在須臾三黃石羔湯主之婦人血風證婦人因崩漏大脫血或前後去血因而涸燥其熱未除循衣摸床撮空閉目不省人事揚手擲足搖動不寧錯語失神脈弦浮而虛內有燥熱之極氣粗鼻乾而不潤上下通燥此為難治宜服生地黃連湯治男子失血多者有此證其妙不可勝言方列下川芎七錢生地七錢赤芍三錢梔子三錢黃芩三錢黃連三錢防風一兩上每服五錢水煎清飲徐徐呷之脈實可加大黃下之大承氣湯氣藥也自外而之內者用之生地黃連湯血藥也自內而之外者用之氣血合病循摸床治同自氣而之血血而復之氣者大承氣湯下之自血而之氣氣而復之血者用生地黃連湯主之二者俱不大便此是承氣湯對手又與三黃石羔湯相表裡是皆三僬為胞絡虛火之用也病既危急只得以此湯降血中之火耳不但婦人用之男子去血過多而有此證者皆有服之無不效豫固表而出之升陽散火湯此湯治患病人義手冒胸尋衣摸床譫語昏沈不省人事俗醫不識見病便呼為風證而用風藥誤人死者多矣殊不知肝熱乘於肺金元氣虛不能自主持名曰撮空證小便利者可治小便不利者不可治人參當歸柴胡白芍黃芩甘草白朮麥冬陳皮茯神有痰者加薑汗炒半夏大便燥之前譫語發渴加大黃泄者加升麻炒白朮水二鍾薑三片棗二枚槌法入金首飾煎之熱服益元湯治有患身熱頭痛全無不煩便作躁悶面赤飲水不得入口庸醫不識呼為熱證而用涼藥誤人死者多矣殊不知元氣虛弱是無根虛火泛上名戴陽證焙附甘草乾薑人參五味麥冬川連知母蔥艾薑一片棗二枚水二鍾煎之臨服槌法入童便三匙頓冷服潮熱屬陽明證旺於未申一日一發日晡而作邪入胃腑為可下之證設或脈浮而緊潮熱而利或小便難大便溏者熱未入腑猶帶表邪當先和解其外如小便利大便硬方可攻之若潮熱於寅卯則屬少陽潮熱於巳午則屬大慶陽是又不可不辨也陽明似瘧煩熱汗出日晡發熱脈或浮或虛者桂枝湯脈實者承氣湯婦人熱入血室其血必結亦如瘧狀小柴胡湯病入熱多寒少脈微弱者無陽也不可發汗越婢湯病人熱多寒少陽乘陰也若尺脈遲為少先以黃耆建中湯養其榮衛脈不遲卻以小柴湯越婢湯選用之以上引陶節庵摘侶景傷寒要旨蓋暑瘧與傷寒來路雖各別然其六經見證之寒熱虛實概可頃參茲細究暑瘧傳變或嘗有之證故略引舉於下以俟同志者參考余未經驗故未另録方治以待完卷補及
