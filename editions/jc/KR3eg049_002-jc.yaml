body:
  text: 卷二文章以獨開生面為奇術業以獨出匠心為貴業如醫尤以無因究因無法立法為高自軒岐內經廬扁難經華元化之五禽圖孫思邈之千金方出天下後世之潛心於醫學者宗厥經旨著述為書而病藥之真詮醫治之妙訣闡發既無遺蘊惟秋瘧一道則尚闕如後之人遂不禁有遺憾焉今讀林德臣先生所著秋瘧指南一書上卷治瘧之寒熱證辨表裡陰陽寒熱虛實一證一方條分縷析皆發前人所未發誠壽世之金針讀至下卷熱瘧證辨條內自制救陰逐暑飲等方乃泄中寓補保存津液為宗旨余如承氣湯以救一線之真陰龍牡湯以靖龍雷之潛伏真武湯以鎮元陽之外泄四逆湯以鎮真陽之上越耆附湯以救脾腎之兩傷參附湯以治陽虛之頭痛細味其調劑之宜支配之妙診治之靈運用之巧真如神龍出漢變化莫測洵千百世之利用無疆也余與效久知先生醫傳五代學有真源先生又能以錦心為苦心推究因中之因法外之法瘧病遂有一事實上之的旨歸醫治遂無不測之態度所謂良醫功同良相非先生誰與歸時在中華民國壬子年春月遇弟楊光焯拜題卷二暑濕燥之單熱證辨暑濕之單熱多由腎陰素虧兼胃陽偏盛所致然陽明為資生之海氣血之源苟因胃陽偏盛津液自劫不能存精於腎以致腎陰日奪陽熱日熾久則腠理不通氣血不宣誠為燔郁之亢陽矣故其病作則熇熇然有如焚天之勢而莫御渾身壯熱頭痛口渴舌苔焦黃大便秘結溲溺赤澀或兼腰痛或腹中飽滯而欲嘔甚則神昏譫語舌苔焦黑晝夜不已嘗見此證綿延難愈多屬危候皆由陰液內竭而然診脈數而大小伏澀不一劇則脈數大而弦甚者更屬難治同志者宜詳審焉擬用救陰逐暑飲主之大黃三錢麥冬三錢半淡竹葉錢半生梔二錢條芩四錢云連八分滑石三錢杏仁錢半花粉二錢青翹四分元參三錢玄明粉一錢水二碗煎至一碗服之此方服三五劑後若濈濈暍暍之勢此乃燠熱內劇當加入羚羊犀角等類與之然邪熱深淺質體弱強偵察圓機裁之青蒿味苦寒而芬芳得春陽之令最早清肝膽之血熱解心脾之暑毒宜採嫩葉童便浸一宿日曬乾存用乃效暑濕之單熱猶有陰液素虧復以遠行勞倦汗液大泄暑淫乘虛而薄之遂致陰液日耗陽熱日盛久則氣血不宣腠理燔郁誠為偏陽之體參病則渾身壯熱頭暈疼口燥渴舌焦黃大便秘溲溺赤擬救陰逐暑飲主之熱已稍有微汗者易痊內經云熱病猶有恣意酒色者陰氣先竭於內陽熱獨滯於中故病則心中惡熱煩冤欲嘔熱則四肢更劇嘗有兼伏暑內蘊者致陰液愈耗陽熱愈熾病則熱勞尤倍然頭暈口渴舌苔焦黃大便秘溲溺赤甚則譫妄者皆暑濕為患也擬救陰逐暑飲加減主之若審暑邪遂輕又當地黃湯加釵斛甘杞甘蓉龜板等類滋之溫之之法大黃三錢條芩四錢云連一錢花粉二錢麥冬三錢元明粉一錢淡竹葉二錢生梔二錢生竹茹一錢滑石二錢釵斛錢半元參三錢水燉半飢服暑瘧之單熱猶有心中煩冤口渴引飲渾身壯熱汗出淋漓四肢微厥此兼衛陽表虛所致擬救陰逐暑飲加桂枝生芍主之若審六脈數實有力又宜除去桂芍加元參粉元明粉大黃四錢麥冬三錢花粉二錢生梔錢半滑石二錢條芩四錢杏仁錢半淡竹葉錢半桂枝五分生芍錢半生甘五分半肌服暑瘧之單熱猶有兼肺家燥熱者然肺乃諸臟之華蓋主治節濡津液內則灑陳臟腑外則充膚澤毛有如雨露之潤焉苟因肺有燥熱復以伏暑內劫遂令治節不行津液不濡腠理不通陽熱日劇故病則渾身壯熱鼻孔焦燥頭痛口渴二便不利甚則昏沉譫語擬救陰逐暑飲加味主之麥冬五錢大黃四錢滑石三錢生梔二錢條芩五錢杏仁二錢云連一錢淡竹葉錢半枳殼三分桔梗三分元明粉一錢柿霜錢半元參三錢水二碗煎至一碗半飢服或問曰經云魄汗未盡留連肌腠者何也答曰魄汗乃肺之合也經氣歸於肺肺朝百脈輸精於皮毛主行榮衛溫分肉充腠理者也然津液發泄之處謂之腠文理縫會之中謂之理因偶受風寒邪汗未盡鬱於肌腠則皮毛閉密腠理不通經氣適旺而經俞這核皆閉矣夫經者徑也邪已不能過於經則留連腠理隨表陽以化熱故耳擬用桂枝白虎湯主之桂枝一錢石羔二錢知母一錢半甘草六分糯米一勺或問曰經俞經隧經舍何謂也答云各司其道經俞者通腑臟之核道也經隧者乃氣血之歷界也經舍者猶行人之傳舍也暑瘧之單熱嘗見兼衛陽盛實者病則熇熇發熱口渴頭痛而無汗蓋由衛陽盛實腠理不通玄府緻密氣不泄越而然診脈多帶浮大滑數宜香薷蠲暑飲加滅主之條芩四錢淡竹葉錢半杏仁二錢滑石三錢生甘六分大黃三錢麥冬二錢川連錢半青蒿五分粉葛錢半羌活八分玄參錢半水二碗半煎至一碗服之此方服三五劑病勞稍退者減除香薷大黃羌活之類加沙參骨皮石蓮之味猶須察病熱之重輕審質體之強弱當圓機裁酌耳繼用清補飲主之少參三錢麥冬錢半生甘六分骨皮錢半洋參八分茯神錢半石蓮錢半蘇淮錢半生芍錢半銀柴一錢水二碗煎至八分中部服夫暑傷於夏秋病為瘧勢所必然猶有兼暴受風熱而傷衛陽之氣遂挾內伏之暑淫交併而作故熇熇發熱濈濈自汗口渴頭痛凡淅淅微惡風寒脈診帶浮數而有力擬用枳桔蠲暑飲主之青蒿五分麥冬三錢川連錢半粉葛一錢天花粉二錢杏仁錢半滑石三錢條芩四錢赤茯一錢生甘六分枳殼八分桔梗八分大黃錢半元參錢半羌活六分水二碗半煎至一碗服之余按陽明篇治療經驗者引舉於下經云火劫傷陰逼血從大腸以下奔以致便血者調胃承氣湯加黃芩生芍或熱從下奔泄瀉濁穢者加芩連或裡急後重兼赤白者加芩連歸芍枳桔若胃陽偏盛病則蒸蒸壯熱溱溱自汗口渴舌焦甚則潮熱昏狂神明撩亂脈洪長數大者調胃承氣加黃芩麥冬花粉之類當有陽明熱盛誤以溫劫以致氣血流溢遍全蒸黃氣粗喘促或頭汗出劑頸而遠乃陽熱上越不能下納於陰之故是由火逼血瘀自制保津消暑飲主之猶有寒熱往來誤以溫劫邪熱益盛津液倍竭以致氣血流溢濕熱外瘀肌膚微腫遍體蒸黃溲溺短澀甚則氣粗喘逆此乃熱逼濕瘀自制梔子黃柏湯治之有兼胃陽偏盛津液素虧陽明之氣上逆撩亂神明煩躁譫語苟誤劫散邪熱傷陰逼血妄行保津消暑飲加犀角丹皮主之暑瘧昏沉寒熱往來誤以劫散遂兼陽明積熱上壅譫語喘咳目睛瞭瞭不得寤寐甚則兩睛直視不能活動宜速驅陽熱而救垂絕之陰保津消暑玄明粉易樸哨加枳實花粉犀角主之嘗有瘧病初發寒熱往來投以劫散致腹滿喘促燥渴譫語循衣摸床小便利者保津消暑加元參花粉治之若溲溺不利則當液內涸膀胱化源竭絕不可為力矣此證或體羸脈虛不堪任下者先以六味生地黃湯加生麗參與之待病機裁之問曰傷寒之承氣用朴硝暑瘧研究室承氣用明粉何也曰傷寒瀉其實暑瘧瀉其熱證熱而不實恐朴硝之過峻而傷陰若是結實之證亦當用朴硝不能膠固耳調胃承氣湯大黃三錢元明粉二錢生甘一錢水燉半肌服保津消暑飲水參二錢大黃二錢麥冬二錢半花粉錢半條芩三錢生甘八分生梔錢半元明粉錢半正羚羊錢半釵斛錢半元參二錢水二碗燉至一碗半飢服梔子黃柏湯生柏二錢茵陳錢半黃柏錢半大黃錢半生甘八分條芩錢半麥冬錢半川連一錢若大便熾秘倍大黃加元明粉水燉半飢服暑瘧症初則寒熱繼則變單熱不甚劇越月不已忽然遍身及頭面起黑點如烏豆大滿腹刺痛痛劇則吐黑血此皆誤於陷邪藥餌致引暑熱內陷太陰遂似蠲暑飲加大黃梔子主之服二三劑後即下黑血諸羞悉除條芩三錢滑石二錢赤茯錢半生甘五分大黃錢半杏仁錢半澤瀉錢半生梔錢半花粉錢半麥冬二錢青蒿三分水燉半飢服暑瘧證兼陽明素有積熱者則潮熱譫語溱溱自汗舌苔焦黃口渴引飲或腹滿痛大便燥秘脈洪大滑實宜大承氣加味主之大黃三錢條芩四錢生梔錢半生甘八分朴硝二錢麥冬四錢枳實錢半天花粉二錢水二碗燉至一碗服暑瘧證留連數日遂致神昏譫語腹滿口乾舌苔焦黃四肢微冷脈沈有力此由熱壅陽明即傷寒論中所謂熱深厥深之義陽極似陰之證也宜大承氣湯加味主之大黃三錢枳實錢半麥冬三錢條芩四錢朴硝錢半水二碗煎至一碗服問曰暑瘧有留連數日後服白虎湯而已者何也答曰此兼陽明散溫之邪其證必煩熱自汗口渴引飲舌苔貢厚脈診浮洪滑實者宜白虎湯主之若瘧之初作即有如上之證脈亦當與救陰逐暑飲為穩當未可概例散漫之邪若六脈浮虛有汗生脈飲主之速扶元氣而救津液猶恐陽亡陰竭之變不可不早慮及此也陽明篇雲散漫少者邪未深入胃腑未曾結實之故暑瘧不可同例混治也至於方藥亂投留連日久之變態或清或溫以意消息圓機度之白虎湯石羔錢半生甘八分知母錢半糯米一勺生脈散洋參錢半麥冬一錢五味十粒暑瘧證嘗有經旬越月不己忽然遍體及頭面起水泡與水痘相似實非水痘極其晶亮此乃初時藥餌不當暑濕不解外瘀腠理衛氣不宣擬用元參連翹蠲暑飲與二服得濈濈自汗而解元參錢半赤茯錢半杏仁錢半香薷三分生甘六分連翹錢半條芩錢半滑石錢半粉葛錢半防風五分水二碗煎至一碗服之暑瘧之單熱口渴無汗旬日不已藥餌無效更有兼腎精素奪水虧火旺而作者則挾龍雷之火以上奔甚則心君撩亂神明不定渾身徽熱晝夜不已脈診多弦緊澀數或劇而脈數亂者斯際用藥最難措手擬於溫則陰液愈劫擬於清則龍雷愈奮余嘗偶幸中之方列下而待司命者裁之繼用加味地黃湯生龍骨五錢生牡蠣三錢麥冬五錢焙附一錢甘杞二錢骨皮錢半生麗參一錢釵斛二錢水燉服加味地黃湯大熟地四錢丹皮一錢萸肉六分釵斛錢半蘇淮二錢澤瀉一錢生芍錢半茯苓錢半車前一錢麥冬錢半巴戟二錢半甘蓉三錢龍骨三錢焙附一錢水二碗煎至八分沖童便半杯空心服肝腎本同宮腎虛則肝無滋養致龍雷之火陡升莫制故先擬龍牡湯而靖龍雷繼用加味地黃湯滋之溫之也暑瘧猶有兼陰虛發熱者脈則細數無力兩尺澀數必有津液枯口乾之症臨症者審之夫陽氣衛於外為陰之藩籬陰氣榮於中為陽之營守陰相濟其體乃治苟雷達精神過度遠行勞倦嗜欲斷喪以致陰液內耗陽熱獨盛故必外蒸於肌表遂成惡熱之證擬用生地黃湯加味治之蘇淮二錢川連八分石蓮肉錢半生地二錢麥冬一錢生芍錢半澤瀉八分茯神錢半粉丹八分元參二錢釵斛錢半此證若無內熱外渴之症審右尺虛甚者須除川連麥冬加焙附主之然病勢有兼於陽虛陰虛者當舍其病而固其本為道同志者宜圓機度之暑瘧證有兼陰虛發熱者醫更雜投以攻劫之劑以致溲溺不利四肢拘急劇則眼睛直視遺溺譫語或腹脹氣逆皆由腎精劫奪膀胱化源竭絕所致此乃危候擬用加味地黃湯主之老熟地三錢茯神錢半焙附二錢甘杞二錢巴戟錢半蘇淮二錢金石斛一錢萸肉八分水兩碗煎至八分服此證若審六脈虛弱無力或弦大者宜四物湯加麗參焙附甘杞甘蓉巴戟等類主之若兼惡寒自汗者當參太陽篇桂枝湯加焙附以救津液之法加麗參更妙同志者合細繹之暑瘧證猶有以手捫其肌肉不熱病人竟自言熱須重按於筋骨之間始得熱氣蒸手此由陰液素虧內熱自熾審六脈細數者六味湯加減主之生地二錢蘇淮錢半澤瀉八分石蓮錢半沙參二錢生牡蠣二錢生芍錢半茯苓錢半粉丹八分骨皮一錢釵斛錢半生龍骨三錢水燉半肌服此證若審六脈沉而有力舌焦口渴二便不利者宜當以羚羊犀角大黃麥冬之類主之問曰暑瘧暴發則昏沉不省而兼煩躁診其六脈皆和藥餌無效遂致不治者何也答云此由腎精素奪陰液內竭更兼泄汗太過心氣暴滅元陽離決之所致故診其六脈皆和者即俗所主胃油末燈光之義也余嘗擬龍骨牡蠣湯而求萬一之幸耳生龍骨兩半生牡蠣一兩麗參二錢水燉不拘服暑瘧之單熱旬日不己脈浮大地鼓指肌肉瘦爍口乾心煩不寐此由腎精內奪則生煩陰血內虛則生熱陽極陰消則肌爍若誤攻之必重傷陰血更為危殆宜六味地黃湯加味主之大熟地三錢淮山二錢茯苓錢半川芎八分生芍錢半澤瀉一錢粉丹八分釵斛錢半沙參三錢當歸錢半甘杞錢半老山洋參一錢水碗半煎八分服暑瘧證有兼腎陰互奪元陽之真氣浮越於外發熱者則身重嗜寐昏沉倦語脈沉無力並裡實內熱之徵甚則揚手露足心煩體躁或反躁煩不寐者難治擬用真武湯加味主之焙附二錢半白朮二錢炒芍錢半茯苓錢半甘杞錢半黑姜一錢當歸錢半熟地炭二錢水一碗煎六分和童便二匙服之人之聲出於肺聲之根出於腎下焦之生氣不足故懶言嗜臥身重沈困熾默默昏寐身重疼痛口和語倦脈沉無力雖無裡實內熱尚有因虛陽上逼舌胎帶黃色等證擬真武湯民五劑病勢遂輕繼加麗參當歸甘杞等類調治而愈焙附二錢白朮錢半乾薑八分茯苓一錢炒芍錢半熟地炭二錢水一碗煎六分和童便二匙服蓋陰虛發熱之證雖熱不甚劇面色必嬌紅而無塵垢舌胎或有帶黃色亦必薄滑至於元陽欲脫之際其熱必劇回陽之藥當倍用抑或補陰益陽抑或補氣回陽此又不可不審暑瘧寒熱往來經旬不已繼則單熱無寒熱已微汗至十餘天反寒粟鼓頷半時許則蒸蒸熱溱溱自汗熇熇暍暍之勢寒不知引衣熱不知去衣至天明熱退默默無言神明不定身重難轉六脈濡軟可關尺尤甚此由腎精素奪陽浮於外之險證遂擬真武湯加味與三四劑其瘧遂除神明漸定茯苓二錢酒芍二錢熟地炭二錢黑姜錢半焙附錢半白朮三錢麗參錢半水燉空心服暑瘧證服藥後身熱譫語四肢厥冷下利清穀脈沉無力若煩躁不寐者難治宜用四逆湯加白朮茯苓主之黑姜錢半焙附二錢白朮錢半茯苓錢半炙甘八分水燉空心服諸證悉皆經驗服湯後加減略舉一二以告同志暑瘧證醫以過服涼劑以致昏沉嗜臥默默無言劇則昏迷不省身重睛露脈沉無力此乃脾腎將絕之危證擬真武湯加參耆與之三服病機遂轉繼加當歸潞黨龍眼等類茯苓一錢炙耆錢半乾薑錢半野山參錢半白朮二錢焙附三錢炒芍二錢炙甘八分甘杞二錢地炭錢半水燉空心服暑瘧證有兼脾腎兩虧者重複誤於攻下以致真氣外泄煩熱無可以置身欲坐臥於泥水之中真液內竭欲引水而自救故渴飲不絕脈多沉微或兼舌苔黃色宜用耆附六君加味主之加麗參更妙潞黨三錢茯神錢半生耆六分歸身錢半龍眼肉十隻白朮二錢炙甘八分焙附一錢炒芍錢半大棗二個甘杞二錢巴戟錢半老熟地錢半水碗半煎至八分和童便二匙服暑瘧證重複誤於攻下以致裡虛外熱面赤身熱腹痛咽痛下利清穀四肢厥沒出逆脈微欲絕者四逆湯加味主之乾薑一錢炙甘八分白朮錢半焙附錢半潞黨二錢桔梗八分水一碗煎至五分入童便二匙空心服暑瘧有發熱煩躁大渴不止脈虛大而無力者此屬陰血虛竭所致擬用四物湯加味主之熟地二錢半生芍錢半沙參二錢甘杞二錢龍眼二隻歸身錢半川芎一錢潞黨二錢炙甘六分大棗二個水一碗煎至五分空心服暑瘧之單熱口渴留連多日更兼誤於攻下以致腹脹氣粗而喘脈診帶弦者此乃肝木乘脾所致宜柴芍六君湯加味主之柴胡八分生芍二錢潞黨三錢茯神錢半甘杞子錢半白朮錢半炙甘六分巴戟錢半水碗半煎至八分服問曰暑瘧病於冬者何也蓋由感受暑邪之輕微溜於經隧之處界伏而不泄雖遇秋燥之斂束邪之勢微不足以泄其氣必期冬令肌表固密諸火內藏暑假內藏之火互相糾郁釀成熇暍之威由是欲張其怒遂於陰氣相搏故凜凜而寒寒不甚劇寒已則熱熱亦不甚劇或遍身疼痛心煩不寐或口渴溺急作止無常或一日一發或間日而發宜香薷蠲暑飲審病勢裁之猶有寒粟鼓頷壯熱昏狂者必由陽明偏旺或陰液內奪同志者當圓機消息耳暑瘧證煩熱頭痛燥渴溺澀脈帶弦其嘔吐痰飲臭味酸穢此乃暑熱挾肝火以陡升逼津液而成飲飲即有形之火火即無形之飲隨火而升降火引飲而逆行擬用柴苓湯主之赤茯錢半柴胡一錢白茯苓錢半條芩三錢竹茹一錢半夏一錢生甘六分麥冬二錢滑石錢半羚羊一錢玄參二錢半夏一錢水碗半煎至八分服暑瘧之單熱苟因數下而傷脾胃以致胸腹䐜脹胸中氣逆甚則神明若失脈益洪大而鼓指此乃陰寒鼓舞而見假實之證茲擬六君加味湯主之若胸腹䐜脹及小腹滿痛溲溺不利脈診得洪大而弦者此是肝木賊脾及膀胱之化源竭絕難以救療聊擬獨參湯亦求萬一之幸也獨參湯生野山參二錢用水一大杯燉至半杯服歸耆六君加味湯生耆八分潞黨三錢茯苓錢半何首烏錢半歸身錢半白朮二錢炙甘六分大棗二個焙附六分甘杞錢半水一煎半碗空心服暑瘧證煩熱口渴自汗身重腹中濡滿脈診微洪而數此乃暑暍挾胃陰燥熱與太陰濕熱糾郁致病夫脾專主腹又主四肢因旋運不行則腹中飲主之條芩二錢半川連一錢棗冬錢半生扁豆一錢花粉錢半白朮一錢蓮心一錢澤瀉一錢滑石一錢水碗半煎至八分服暑瘧證脈胗疾燥不為藥解此即陰液外脫陽熱內陷經所謂陰陽交錯即此義也故主不治暑瘧證不為藥解呃逆不止甚則其氣從臍下上衝連不斷者此即腎氣欲脫之危症主不治暑瘧證服湯已病不解譫語狂言直視遺尿者此腎絕也主不治暑瘧證煩熱不止汗如貫珠成循衣摸床喘汗不休皆陽衷邪盛主不治經云癉瘧者肺素有熱氣盛於中而偶受風寒內藏於心外舍分肉之間而發發則陽氣獨盛陰氣內虛不能與陽爭故單熱不寒令人消灼肌肉金匱云陰氣孤絕陽氣獨發發則熱而少氣煩冤手足熱而欲嘔名曰癉瘧若但熱不寒者邪氣內藏於心外舍分肉之間令人消灼肌肉按此二案大意相同然陽極則陰消故肌肉消灼此昔腎皆指風寒而言故用桂枝白虎湯乃能獲效但此伏暑假秋燥而發者相去天淵不同例也紅花退熱奇案有友患單燒輒投石羔白虎及羚羊犀角之類遂致熱勞倍熾心如火棼病者竟以冷水帕自放心胸而求苟安須臾莫離醫者更擬大黃朴硝等類與之亦皆罔效由是熱勞日亢病勢日危徬徨無策將束的而待斃乃所謂斯熱病而用斯涼劑服之無靈脩短亦委天命耳氣息奄奄之際遂擬西紅花二錢麥冬三錢川連一錢與服病者自覺如飲冰雪焉及後熱勞勢頓輕繼服生六味地黃湯而愈人皆駭奇余曰非奇也此乃誤服石膏知母羚羊犀角之證驗耳何也余審讀內經明言暑侵肌表故首論邪從表來必令仍從表去病方易已緣伊熱瘧初作妄用閉門留寇之類復引暑邪內陷心胞致令煩冤倍甚如火薰蒸更加自誤以冷水頻沽以致腠理愈密三焦愈閉熱勢益深病勢益劇且燠熱內踞心胞為巢為穴蔓延繹絡誠陽亢之赤地炎蒸日久則血液槁瘀如燔如炙危殆悉至特要紅花假連麥為嚮導直入心胞蕩共發電機穴滌其瘀垢雖酷烈之勢悉隨響應而解散頃刻轉為清涼境界矣故所病者有若飲水雪之清焉繼及六味地黃湯濡養心液則諸恙遂瘥猶有謂大黃朴硝皆蕩邪滌熱之藥何以無效殊不知彼乃足陽明胃腑之藥此乃手厥陰胞絡之病彼此天淵須當縷析證因碑載奇命曰奇案暑瘧之寒誤服陷邪藥餌遂致咳嗽氣逆越日一發如癇狀數月不已擬用香薷蠲暑飲加黨參生苡米與服數劑而愈暑瘧之單熱初時雜投藥品延至數月不愈乍愈乍作或間日一發或三五日一發服溫清補瀉皆無效擬用蠲暑飲加大黃桑皮石蓮與服數劑而愈暑瘧之寒熱因誤於藥邪陷太陰遂生燥咳或微發寒熱時作時此數月不已如癆火之狀擬用香薷蠲飲加桑皮紫苑覆花生芍等類與服諸恙漸愈暑瘧之寒熱苟因妄投藥餌邪氣流連不解數月不已擬用補益增寒熱擬用清則生泄瀉遂用蓮淮六君川蓮麥冬車前扁豆等類與服數劑而愈附錄唐容川先生痢證方治諸方列下痢為病發秋天古名腸澼又名滯下令名曰痢而又不爽利也與洞瀉相別天淵四季皆有此症惟秋時此病為更多所以秋時此症更多者蓋五行之序由春入夏為木生火熱氣主事之時也由夏至長夏六月為火生土是為濕土主事之時熱來蒸濕合氣為暑故六月節名小暑大暑至秋以後則土來生金濕熱當止故其節名處暑言氣自此止也暑止則熱氣變為涼氣而涼風至矣濕氣變為清氣而清肅降矣如此則秋金氣旺木火自蕺中土不致受邪矣若其人之肝木大旺遇金來制之而木不受制遏郁生火則熱氣不退火反剋金金氣不得清肅因之濕亦不化與熱相蒸蘊結血氣於三焦腸胃之間釀為腐穢膠黏之汗則成痢矣蓋人身肝主疏者條達而止也泄者順利而下也木氣不疏則鬱郁者草木多而壅遏也木氣大泄則暴注者泄力太過之故也然使金不與木爭則泄而不斂何至滯塞哉惟當秋金收斂之令肺氣不應受邪故金必與木爭木愈旺則金愈收是以逼迫難澀而成裡急後重也銀菊花治白痢之輕藥也銀花三錢白菊三錢生白芍三錢杏仁三錢連翹二錢桔梗三錢梔子三錢木香一錢牛蒡子三錢甘草三錢用水三茶碗煎取碗半服如有宿食加生大黃五錢白虎湯治痢之重證也研生石羔三錢煆石羔三錢甘草一錢粳米三錢再加淡條芩三錢白芍三錢杏仁三錢杏梗二錢厚朴一錢此方合痢症有外寒者再加葛根荊芥小便不利者再加桑皮滑石此治白痢之良方也白頭翁治紅痢白頭翁五錢黃柏三錢黃連三錢秦皮三錢用水二碗煎取一碗最妙白頭翁能平木疏肝息風清火使下迫之氣條達而上也金花湯治紅痢今名黃連解毒湯黃連三錢黃芩三錢黃柏三錢梔子三錢加杏仁三錢檳榔三錢當歸三錢地榆三錢赤芍二錢荊芥一錢生地三錢青蒿三錢生甘一錢水煎服霹靂散治痢症脹閉有宿食發嘔等症生大黃一錢黃芩三錢吳萸一錢用水二碗煎取一碗先服半碗得快利即勿服如不快利再服一次此藥只可服三次不可多服大承氣湯治奇恆痢生大黃二錢厚朴二錢枳殼一錢芒硝三錢先煎三味既成後入芒硝三沸取汗服咽痛嗆略愈即止再加減金花湯三黃酒治痢症發嘔吐者按發嘔吐食不食真噤口嘔吐止即能進食黃連一錢黃芩三錢生大黃二錢用好燒酒二碗煎成一碗徐徐嚥下如飲酒者用水一碗加酒一杯煎服徐咽嘔吐止即勿服救胃煎治噤口不食生地三錢白芍三錢黃連三錢玉竹三錢炒枳殼八分杏仁三錢桔梗二錢石羔四錢麥冬三錢花粉三錢生甘一錢黃芩三錢厚朴一錢右水三茶碗煎取碗半必舌上有津液則進食矣開禁湯治噤口不食人參二錢麥冬三錢煆石膏三錢梔子二錢川連二錢黃芩一錢黃柏一錢生地三錢當歸三錢射干二錢杏仁三錢檳榔一錢枳殼一錢生甘一錢花粉二錢此為治噤口痢之主方生津進食除腸胃中之炎症力量周至再加白頭翁則詳盡無遺矣歸地養榮湯當歸三錢生地三錢淮山三錢麥冬三錢白芍三錢蓮子心三錢桑葉三錢荷葉三錢釵斛三錢玉竹三錢水二碗煎取一碗痢愈後多服大補益元氣調胃承氣湯生大黃三錢芒硝二錢生甘一錢水煎二味既成再入芒硝二沸即取得快利即止桃花湯治痢症不後重者赤石脂一錢糯米五錢黑姜一錢上三味久煎成湯服之能溫補止澀為虛滑痢之主方不後重下痢者乃用清寧丸治休息痢生大黃四兩用薄荷拌酒蒸一次去薄荷干後用去糟米酒半斤好燒酒四兩泡二七日在飯上蒸一次再攪一次再曬露再蒸乾再加酒至大黃爛如泥為丸如綠豆大每服或一錢或五分大便微下則愈鳥梅丸治虛滑久痢不後重者鳥梅十枚去核川連三錢黃柏一錢人參一錢桂枝一錢細辛一錢焙附一錢當歸一錢花椒一錢乾薑二錢上為末用鳥梅飯上蒸熱搗和加蜜為丸如桐子大每服三十丸米飲下附錄經驗奇恆痢症余治族人始患痢日夜數十行紅白相間六脈大服黃芩蓮導滯等類罔效繼則病勢日劇渴飲熱湯乃快延余診視六脈數大無倫遂擬歸芍六君加味取效繼用歸脾湯而愈矣老山洋參一錢生芍錢半於朮一錢酒芩八分焙附一錢甘杞二錢歸身二錢吳萸制川連八分炙甘八分潞黨二錢水燉空心服附經驗鼠疫證治鼠疫為患皆由陰陽不齊時序不知天降異災地生熱毒惟鼠質最熱鼠性最靈先感召其熱毒而死沿門合境皆是繼則傷於人然受病之因不一或內因積熱而引外毒或由竅道感受地氣之熱毒或由口鼻感觸死鼠之臭穢或由鼠蝨而傷人之肢體鼠疫之名由此來也究竟其毒直中陽明當慎於始始則病形未彰起居如常或口燥咽乾或似飢非飢或飢而欲食或臥寐煩躁或困倦欲臥或四肢酸痹或遍身旋痛或頭眼暈痛或乍寒乍熱或咳嗽腹痛以上諸證皆受病之始如有一二證即系此病之發見端便應作時疫調治庶幾有萬全之功然邪氣傷人必乘虛而湊之若素有舊病之人必從舊病先起無論頭痛腰痛胸腹氣痛切不可概舊例而治之必須按此方而服之可保無患耳藥方連翹二錢粉葛根二錢玄參五錢丹皮三錢牛蒡二錢條芩六錢麥冬五錢赤芍三錢大黃三錢紫草五錢用水三大碗煎至二大碗半飢服若大便秘結加玄明粉一錢半調藥水服必須連服數劑二便利病退為度毒氣甚者必下黑血而愈如肢體有結核者加西紅花二錢桃仁一錢半猶有肢體結核而不痛無憎寒壯熱者此由鼠蝨所傷之輕病不藥可愈食物須知患疫症者僅可用薯粉作羹綠豆煮湯食之山薯即番薯切戒飲食鼠疫切忌粥飯即飯湯亦不沾唇然粥飯入胃濁氣歸心最助陽明之熱毒若誤食米穀必殆切忌黃糖白糖甜氣入脾最助邪熱切忌冷水若誤食之則血液瘀滯切忌生青瓜果若誤食之患同冷水無異切忌暈魚蝦酒面等類若誤食之必殆須要腸胃熱毒瀉盡憎寒壯熱頓除之後方可用米少許和綠豆煮粥漸次飲之論疫之重證蓋陽為資生之海氣血之源主肌肉而潤宗筋故毒中陽明則肢體疼痹憎寒壯熱或口渴引飲或藥不下咽或腰腹脹痛二便秘澀猶有結核者多生於兩胯兩脅兩胯猶多亦有生於肢體左右上下不等究其結核之由皆緣井榮腧原經合之筋脈互相交錯之處值其虛者毒必湊之氣血與熱毒互交糾結則核生焉然多生於胯脅者何也胯為陰包之界脅為大包之屬乃宗筋之要道熱毒流壅於胯脅則宗筋凝樞要不通機關不利故核多糾結矣核之形或大如鴨卵如覆杯小則如龍眼如鈕仔或紅腫而不痛有隱隱而痛有痛楚難堪須知痛甚必由其毒甚所致最忌針刀若鹵莽誤用必殆治之之法總要用藥得宜必令瀉盡腸胃黑穢之毒物蕩盡則憎寒壯熱自除諸恙自己如果核不銷散由其自然而出膿水謹慎藥餌和緩調理可保平安歷驗不爽列方於下必須連服數劑俟毒盡為度連翹三錢玄參一兩半條芩一兩紫草一兩丹皮八錢大黃六錢丹參四錢牛蒡三錢麥冬一兩半公英五錢生地二兩赤芍五錢粉葛三錢水煎臨服加西紅花二錢玄明粉三錢沖藥水調勻均三五次服如質體強旺壯熱盛者用大黃一兩或一兩半玄明粉易朴硝五錢審病勢度之如果憎寒壯熱遂除核不銷散者宜生地四物加減生地五錢生芍一錢半條芩三錢連翹一錢半玄參三錢歸身一錢半麥冬三錢紫草四錢牛蒡子一錢半公英三錢桃仁一錢角刺二錢此方可連服十貼或五貼當審質體強弱病勢重輕同志者圓機裁度核色紅者加大黃二錢色白者加黨參二錢川芎一錢痛者加乳香六分如結核處痛甚者宜用生地四兩銀花二兩紫草四兩乳香三錢沒藥三錢濃煎乘熱頻頻洗之另用大黃末加梅片少許蘸蜂糖塗患處此證按法調理有十餘天而出膿水者有月餘而出膿水者至出膿水時宜生熱四物湯加減生地三錢當歸二錢釵斛一錢生甘八分玄參三錢熟地四錢生芍一錢半紫草三錢麥冬三錢老山洋參一錢此方可服數劑如膿水未乾加蘇淮三錢茯苓二錢半川芎一錢黨參三錢當歸三錢或倍用洋參或加白朮圓機之士宜活潑度之論疫之危證夫陽明居中士乃多氣多血之海萬物所歸無所復傳故毒壅胃腑則水腎水暴竭津液驟涸所以毒攻於腎則躁煩腰折咽喉腫痹毒攻於肝四肢瘛瘲循衣葉血毒攻於脾則腹脹氣促身重難轉毒攻胃腕則嘔逆難嚥毒攻於心則妄語昏狂毒攻於肺則咳嗽痰血毒攻督脈巔頂若劈毒攻筋脈四肢抽搐毒攻衝任則血逆而吐毒攻於腦則頭痛而暈以上諸證危亡旦夕附方於下以求萬一之幸生地三兩條芩二兩玄參二兩半丹皮一兩正犀角五錢麥冬二兩半大黃一兩半紫草二兩正羚羊五錢赤芍五錢當歸三錢生甘二錢水煎臨服加西紅花三錢朴硝五錢沖藥水服均數次服之附醫家小說閒嘗讀孔子魯論於南人一章有曰人而無恆不可以作亞巫醫蓋孔子所以述南人之言者惟恐人立心無恆致使作輟鮮終未嘗以巫醫為賤役而朱子獨釋巫醫為賤役巫之道吾不可知以醫為賤役余殆有所未解何也竅思醫之源流創自神家天生神聖以救萬民者也是以神農發明本草軒轅作靈經岐伯洋互問伊尹作湯液長沙著傷寒慮醫著難經和緩辨膏盲削骨療醫華陀之發起不誣筆點龍睛邈之真詮尚在據考千古名醫非聖君腎相即仙風道骨之流以醫為賤役者果何謂哉雖然朱子亦腎人也揣其所以為是言者豈真無謂哉勿論他人即鄙人亦嘗遇之餘猶記托跡三河遇富貴家後裔延余診其少君入門伊始掃榻歡迎而且敬及診視後且言病機不治余欲他往奈殷勤挽駕停留一夕豈料坐談間毫無禮趣且童僕無告問其居心厚薄不可知而其視醫為賤役則昭然若揭予始疑朱子之說者予轉服朱子之言不我欺也然而予說是言未終有博學先生執余手而言曰如子之言其置天生神聖之神家輩為何地且視仙風道骨之流為何人乎遂各粲然一笑而起
